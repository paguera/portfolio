name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Backend (Express & TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-express

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend-express/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Build & Type Check
        run: npm run build

  frontend-visiteurs-check:
    name: Frontend Visiteurs (React & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-visiteurs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-visiteurs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Build Application
        run: npm run build

  frontend-admin-check:
    name: Frontend Admin (React & Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Build Application
        run: npm run build

  docker-build-check:
    name: Docker Build Validation
    needs: [backend-check, frontend-visiteurs-check, frontend-admin-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-express
          push: false
          tags: portfolio-backend:test

      - name: Build Frontend Visiteurs Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-visiteurs
          build-args: |
            VITE_BASE_URL=http://localhost:3000/api
          push: false
          tags: portfolio-visiteurs:test

      - name: Build Frontend Admin Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-admin
          build-args: |
            VITE_BASE_URL=http://localhost:3000
          push: false
          tags: portfolio-admin:test
